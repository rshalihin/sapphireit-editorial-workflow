name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }} / WP ${{ matrix.wp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.1', '8.3' ]
        wp: [ '6.8', 'latest' ]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sit_cwm_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      # phpcs exits non-zero on any error or warning; there is no warnings-only mode.
      - name: Lint (phpcs, WordPress-Extra)
        run: composer lint

      - name: Unit tests
        run: composer test

      - name: Pin the WordPress test library to the matrix version
        if: matrix.wp != 'latest'
        run: |
          composer require --dev --no-update "wp-phpunit/wp-phpunit:${{ matrix.wp }}.*"
          composer update wp-phpunit/wp-phpunit --no-interaction --no-progress

      - name: Download WordPress ${{ matrix.wp }}
        run: |
          if [ "${{ matrix.wp }}" = "latest" ]; then
            URL="https://wordpress.org/latest.tar.gz"
          else
            URL="https://wordpress.org/wordpress-${{ matrix.wp }}.tar.gz"
          fi
          mkdir -p /tmp/wordpress
          curl -sSL "$URL" | tar -xz -C /tmp/wordpress --strip-components=1

      - name: Write wp-tests-config.php
        run: |
          cat > tests/php/wp-tests-config.php <<'PHP'
          <?php
          define( 'ABSPATH', '/tmp/wordpress/' );
          define( 'WP_DEFAULT_THEME', 'default' );
          define( 'WP_DEBUG', true );
          define( 'DB_NAME', 'sit_cwm_tests' );
          define( 'DB_USER', 'root' );
          define( 'DB_PASSWORD', 'root' );
          define( 'DB_HOST', '127.0.0.1' );
          define( 'DB_CHARSET', 'utf8mb4' );
          define( 'DB_COLLATE', '' );
          $table_prefix = 'wptests_';
          define( 'WP_TESTS_DOMAIN', 'example.org' );
          define( 'WP_TESTS_EMAIL', 'admin@example.org' );
          define( 'WP_TESTS_TITLE', 'Test Blog' );
          define( 'WP_PHP_BINARY', 'php' );
          define( 'WPLANG', '' );
          PHP

      - name: Integration tests
        run: composer test:integration

  js:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint:js
      - run: npm run test:unit
      - run: npm run build

      # assets/build/ is committed (D11): a rebuild must not change it.
      - name: Check for uncommitted build output
        run: git diff --exit-code -- assets/build

  e2e:
    name: End-to-end
    needs: [ js ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run env:start
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: artifacts/
          retention-days: 7
